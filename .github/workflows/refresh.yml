name: Refresh SBS ratings

on:
  schedule:
    # Once a day at 15:00 UTC (~1am AEST / 2am AEDT). OMDb's free quota is a
    # rolling 24h window, so any daily time works.
    - cron: "0 15 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Allow the job to commit the refreshed data.json back to the repo.
permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Persist the OMDb rating cache between runs so each day only spends
      # quota on new/changed titles. actions/cache keys are immutable, so we
      # write a fresh key each run and restore the most recent one by prefix.
      - name: Restore OMDb cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: omdb-cache-${{ github.run_id }}
          restore-keys: |
            omdb-cache-

      - name: Fetch ratings
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: npm run fetch

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data.json
          if git diff --staged --quiet; then
            echo "No changes to data.json."
          else
            git commit -m "chore: refresh SBS ratings [skip ci]"
            git push
          fi
